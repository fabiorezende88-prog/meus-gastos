<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Meus Gastos</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">CONTROLE FINANCEIRO</div>
      <h1>Meus Gastos</h1>
    </div>
    <button class="month-btn" id="monthBtn"></button>
  </header>

  <main>
    <section class="summary">
      <span>Total gasto no mês</span>
      <strong id="total">R$ 0,00</strong>
      <div class="split">
        <div><span>Fixas</span><b id="fixedTotal">R$ 0,00</b></div>
        <div><span>Variáveis</span><b id="variableTotal">R$ 0,00</b></div>
      </div>
    </section>

    <button class="add-btn" id="addBtn">＋ GASTO</button>

    <section class="card">
      <div class="section-title"><h2>Gastos recentes</h2><button id="clearBtn" class="text-btn">Limpar</button></div>
      <div id="expenseList" class="expense-list"></div>
    </section>
  </main>
</div>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Novo gasto</h2>
      <button id="closeBtn" class="close">×</button>
    </div>

    <label class="value-label">Valor</label>
    <input id="value" class="value-input" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off">

    <div class="toggle">
      <button data-type="fixed">FIXA</button>
      <button data-type="variable" class="active">VARIÁVEL</button>
    </div>

    <label>Categoria</label>
    <div id="categories" class="categories"></div>

    <label for="description">Descrição <small>(opcional)</small></label>
    <input id="description" class="text-input" placeholder="Ex.: Restaurante">

    <button id="saveBtn" class="save-btn">SALVAR GASTO</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
