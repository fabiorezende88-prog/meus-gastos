<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Meus Gastos</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=8"></head>
<body><div class="app">
<header><div><small>CONTROLE FINANCEIRO</small><h1>Meus Gastos</h1></div><button id="monthBtn"></button></header>
<section class="summary"><span>Total gasto</span><strong id="total">R$ 0,00</strong><div class="split"><div>Fixas<b id="fixed">R$ 0,00</b></div><div>Variáveis<b id="variable">R$ 0,00</b></div></div></section>
<section class="card budget"><div class="row"><h2>Orçamento do mês</h2><button id="budgetBtn">Definir</button></div><div class="row"><b id="spent">R$ 0,00</b><span id="available">Sem orçamento</span></div><div class="progress"><i id="progress"></i></div></section>
<button class="add" id="addBtn">＋ GASTO</button>
<section class="card"><div class="row"><h2>Gastos recentes</h2><button id="clearBtn">Limpar mês</button></div><div class="filter-title">FILTRAR GASTOS</div><div class="type-pills"><button class="filter-pill active" data-type="all">Todos</button><button class="filter-pill" data-type="fixed">Fixas</button><button class="filter-pill" data-type="variable">Variáveis</button></div><select id="categoryFilter"><option value="all">Todas as categorias</option></select><div id="list"></div></section>
<section class="card"><h2>Resumo por categoria</h2><div id="cats"></div></section>
<section class="card"><h2>Últimos 6 meses</h2><div id="chart" class="chart"></div></section>
</div>
<div class="modal hidden" id="modal"><div class="sheet"><div class="row"><h2 id="modalTitle">Novo gasto</h2><button class="close" id="close">×</button></div>
<label>Valor</label><input id="value" class="value" inputmode="decimal" placeholder="R$ 0,00">
<div class="toggle"><button data-t="fixed">FIXA</button><button data-t="variable" class="on">VARIÁVEL</button></div>
<label>Categoria</label><div id="categoryButtons" class="categoryButtons"></div>
<label>Descrição <em>(opcional)</em></label><input id="desc" class="text" placeholder="Ex.: Restaurante"><button class="save" id="save">SALVAR GASTO</button></div></div>
<div class="modal hidden" id="budgetModal"><div class="sheet"><div class="row"><h2>Orçamento mensal</h2><button class="close" id="budgetClose">×</button></div><p>Defina o limite de gastos do mês selecionado.</p><input id="budgetValue" class="value" inputmode="decimal" placeholder="R$ 5.000,00"><button class="save" id="budgetSave">SALVAR ORÇAMENTO</button></div></div>
<div class="modal hidden" id="months"><div class="sheet"><div class="row"><h2>Escolher mês</h2><button class="close" id="monthsClose">×</button></div><div id="monthList"></div></div></div>
<script src="app.js?v=8"></script></body></html>
